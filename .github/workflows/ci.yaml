---
name: "CI"

on:
  push:
    branches:
      - "**"
  pull_request: ~

jobs:
  main:
    name: "Validate configuration"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # v6.0.3

      - name: "Validate filenames"
        run: |
          python3 dev/validate-filenames.py

      - name: "Check Renovatebot config"
        uses: "docker://ghcr.io/renovatebot/renovate"
        with:
          # Use a custom entrypoint script so we can make use of globbing.
          # The Github syntax for 'args' doesn't allow it.
          entrypoint: "dev/config-check-entrypoint.sh"
